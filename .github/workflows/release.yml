name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --split-debug-info=build/symbols/android --obfuscate

      # V2.0 用完整功能说明；后续版本自动汇总从上一标签到本次标签的提交，
      # 并附上功能一览，避免每次手写更新日志。
      - name: Generate release notes
        run: |
          if [ "${GITHUB_REF_NAME}" = "v2.0" ]; then
            cp docs/RELEASE_NOTES.md release_notes.md
          else
            {
              echo "## 本次更新"
              echo
              PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
              if [ -n "$PREV" ]; then
                git log --pretty=format:'- %s' "$PREV..${GITHUB_REF_NAME}"
              else
                git log --pretty=format:'- %s' -20
              fi
              echo
              echo
              sed -n '/^## 功能一览/,$p' docs/RELEASE_NOTES.md
            } > release_notes.md
          fi
          cat release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 爽听 ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          overwrite_files: true
