name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(sed -n 's/^version: //p' pubspec.yaml | head -1 | tr -d '\r')
          VERSION=${RAW%%+*}
          BUILD=${RAW##*+}
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            IFS=. read -r MAJ MIN PAT <<< "$VERSION"
            VERSION="$MAJ.$MIN.$((PAT + 1))"
            BUILD=$((BUILD + 1))
            sed -i "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore: release $VERSION [skip ci]"
            git push origin HEAD:main
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($BUILD)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/shuangting-release.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/shuangting-release.jks
          EOF
          else
            echo "::warning::No keystore secret, falling back to debug signing"
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android
        run: flutter build apk --release --split-per-abi

      - name: Build Windows
        run: flutter build windows --release

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/shuangting-$V-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/shuangting-$V-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/shuangting-$V-x86_64.apk"
          powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/shuangting-$V-windows-x64.zip' -Force"
          ls -lh dist

      - name: Release notes
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          awk -v ver="$V" '$0 ~ ("^## v" ver "([^0-9]|$)") {p=1; next} /^## v/ {p=0} p' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "自动构建版本 $V。" > notes.md
            echo "" >> notes.md
            echo "完整改动见仓库提交记录与 CHANGELOG.md。" >> notes.md
          fi

      - name: Tag release commit
        shell: bash
        run: |
          git fetch origin main
          git tag -f "${{ steps.ver.outputs.tag }}" origin/main
          git push -f origin "${{ steps.ver.outputs.tag }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 爽听 ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: false
