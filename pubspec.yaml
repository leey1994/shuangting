name: shuangting
description: "爽听 - 一款全新的音乐播放体验"
publish_to: 'none'
version: 0.0.4+4

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  audio_session: ^0.2.4
  http: ^1.5.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  archive: ^4.0.7
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.2
  open_filex: ^5.0.0
  window_manager: ^0.5.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  file_picker: ^13.1.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0E14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
