<script>
    // 可伸缩布局方案
    !function (window) {
        var doc = window.document;
        var docEl = doc.documentElement;
        var resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize';
        var html = document.documentElement;

        var recalc = (function refreshRem() {
            // 720/1200，中间主体内容宽高
            var minPageHeight = 1200;
            var designSize = 720; // 设计图尺寸
            
            var scale = 1;
            // 有些浏览器（比如safari）outerHeight跟innerHeight不一样
            var winW = window.innerWidth || document.documentElement.offsetWidth;
            var winH = window.innerHeight || document.documentElement.offsetHeight;

            window.screenIsShort = winW / winH > 720 / minPageHeight; // 小于标准高度，这时候要缩放

            if (window.screenIsShort) {
                scale = (winH * 720) / minPageHeight / winW;
            }
            
            var rem = (winW * 100 / designSize) * scale;

            html.style.fontSize = rem + "px";

            docEl.setAttribute('style', 'font-size: ' + rem + 'px !important');
            return refreshRem;
        })();

        if (!doc.addEventListener) return;
        window.addEventListener(resizeEvt, recalc, false);
        doc.addEventListener('DOMContentLoaded', recalc, false);
    }(window);
</script>
